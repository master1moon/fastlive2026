<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>البث غير متاح - استراحتنا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: transparent;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        /* الحاوية تأخذ العرض الكامل المتاح وتحافظ على نسبة 16:9 */
        .offline-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1420 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        .offline-icon {
            font-size: clamp(40px, 10vw, 80px);
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        h1 {
            font-size: clamp(20px, 5vw, 28px);
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        p {
            color: #a0aec0;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: clamp(12px, 3.5vw, 16px);
        }
        button {
            background: #3b82f6;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            color: white;
            font-size: clamp(12px, 3.5vw, 16px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        button:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
        .timer {
            margin-top: 20px;
            font-size: clamp(11px, 3vw, 14px);
            color: #94a3b8;
        }
        /* تحسين للشاشات الصغيرة جدًا */
        @media (max-width: 480px) {
            .offline-container {
                padding: 15px;
                border-radius: 15px;
            }
            .offline-icon {
                margin-bottom: 10px;
            }
            h1 {
                margin-bottom: 10px;
            }
            button {
                padding: 8px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">🎬</div>
        <h1>البث المباشر متوقف حالياً</h1>
        <p>عذراً، لا يوجد بث حي في هذه اللحظة.<br>سيتم تشغيل البث تلقائياً عند بدء الناشر.</p>
        <button onclick="location.href='index.html'">🔄 محاولة مرة أخرى</button>
        <div class="timer">سيتم إعادة المحاولة تلقائياً خلال <span id="countdown">30</span> ثانية</div>
    </div>
    <script>
        let seconds = 30;
        const countdownSpan = document.getElementById('countdown');
        const interval = setInterval(() => {
            seconds--;
            countdownSpan.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>
</html>
